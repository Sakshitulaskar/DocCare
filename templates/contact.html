{% extends 'base.html' %}

{% load static %}

{% block title %}
Contact
{% endblock %}

{% block content %}

<style>

.contact-section{
    width:100%;
    padding:90px 8%;
    background:#f8f9fa;
}

.contact-title{
    text-align:center;
    margin-bottom:60px;
}

.contact-title h1{
    font-size:55px;
    color:#0a2a43;
    margin-bottom:15px;
    font-weight:700;
}

.contact-title p{
    color:#666;
    font-size:18px;
}

.contact-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:50px;
    flex-wrap:wrap;
}

.contact-info{
    flex:1;
    min-width:300px;
}

.info-box{
    display:flex;
    align-items:center;
    gap:20px;

    background:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.4s;
}

.info-box:hover{
    transform:translateY(-8px);
}

.info-box img{
    width:65px;
    height:65px;
}

.info-box h3{
    color:#0d6efd;
    font-size:24px;
    margin-bottom:5px;
}

.info-box p{
    color:#666;
    font-size:16px;
}

.contact-form{
    flex:1;
    min-width:300px;

    background:white;
    padding:40px;
    border-radius:20px;

    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.contact-form h2{
    color:#0a2a43;
    margin-bottom:25px;
    font-size:35px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;

    border:1px solid #ddd;
    border-radius:10px;

    font-size:16px;
    outline:none;
}

.contact-form textarea{
    resize:none;
    height:140px;
}

.contact-form button{
    width:100%;
    padding:15px;

    border:none;
    border-radius:10px;

    background:#0d6efd;
    color:white;

    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.contact-form button:hover{
    background:#0b5ed7;
}

/* MOBILE RESPONSIVE */

@media(max-width:768px){

    .contact-section{
        padding:70px 5%;
    }

    .contact-title h1{
        font-size:42px;
    }

    .contact-form{
        padding:30px 20px;
    }

}

@media(max-width:480px){

    .contact-title h1{
        font-size:34px;
    }

    .contact-form h2{
        font-size:28px;
    }

}

</style>

<section class="contact-section">

    <div class="contact-title">

        <h1>Contact Us</h1>

        <p>

            Feel free to contact DocCare for
            appointments and healthcare support.

        </p>

    </div>

    <div class="contact-container">

        <!-- LEFT INFO -->

        <div class="contact-info">

            <div class="info-box">

                <img src="{% static 'images/email.png' %}">

                <div>

                    <h3>Email</h3>

                    <p>doccare@gmail.com</p>

                </div>

            </div>

            <div class="info-box">

                <img src="{% static 'images/phone.png' %}">

                <div>

                    <h3>Phone</h3>

                    <p>+91 9876543210</p>

                </div>

            </div>

            <div class="info-box">

                <img src="{% static 'images/location.png' %}">

                <div>

                    <h3>Location</h3>

                    <p>Kolkata, India</p>

                </div>

            </div>

        </div>

        <!-- RIGHT FORM -->

        <div class="contact-form">

            <h2>Send Message</h2>

            <form>

                <input type="text"
                       placeholder="Your Name">

                <input type="email"
                       placeholder="Your Email">

                <input type="text"
                       placeholder="Subject">

                <textarea
                    placeholder="Write your message">
                </textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
