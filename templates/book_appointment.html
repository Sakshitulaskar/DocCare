{% extends 'base.html' %}

{% block title %}
Book Appointment
{% endblock %}

{% block content %}

<div class="appointment-container">

    <form method="POST" class="appointment-form">

        {% csrf_token %}

        <h2>
            Book Appointment
        </h2>

        <input type="text"
               value="Dr. {{ doctor.username }}"
               readonly>

        <input type="date"
               name="date"
               required>

<select name="time" required>

    <option value="">
        Select Time
    </option>

    <option value="10:00">
        10:00 AM
    </option>

    <option value="11:00">
        11:00 AM
    </option>

    <option value="12:00">
        12:00 PM
    </option>

    <option value="14:00">
        2:00 PM
    </option>

    <option value="16:00">
        4:00 PM
    </option>

</select>

               <input type="number"
       name="age"
       placeholder="Enter Age"
       required>

<input type="text"
       name="phone"
       placeholder="Phone Number"
       required>

<select name="gender" required>

    <option value="">Select Gender</option>

    <option value="Male">Male</option>

    <option value="Female">Female</option>

    <option value="Other">Other</option>

</select>

        <textarea name="message"
                  placeholder="Write your problem..."
                  required></textarea>

        <button type="submit">

            Confirm Appointment

        </button>

    </form>

</div>

{% endblock %}
