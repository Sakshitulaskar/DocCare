{% extends 'base.html' %}

{% block title %}
Create Doctor Profile
{% endblock %}

{% block content %}

<div class="profile-page">

    <div class="profile-card">

        <h2>
            Create Doctor Profile
        </h2>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">

                <input type="text"
                       name="specialization"
                       placeholder="Specialization"
                       required>

            </div>


            <div class="form-group">

                <input type="text"
                       name="qualification"
                       placeholder="Qualification"
                       required>

            </div>


            <div class="form-group">

                <input type="number"
                       name="experience"
                       placeholder="Experience"
                       required>

            </div>


            <div class="form-group">

                <input type="text"
                       name="hospital"
                       placeholder="Hospital Name"
                       required>

            </div>


            <div class="form-group">

                <input type="number"
                       name="fees"
                       placeholder="Consultation Fees"
                       required>

            </div>


            <div class="form-group">

                <input type="file"
                       name="image"
                       required>

            </div>


            <button type="submit"
                    class="profile-btn">

                Create Profile

            </button>

        </form>

    </div>

</div>

{% endblock %}
